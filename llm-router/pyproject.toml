[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "Local-first LLM routing & escalation service with an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrei" }]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-router = "router.__main__:main"

[tool.setuptools.packages.find]
include = ["router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
